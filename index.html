<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Моё первое Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 24px;
      display: grid; place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: var(--tg-theme-bg-color, #f2f4f7);
      color: var(--tg-theme-text-color, #17212b);
    }
    main {
      width: min(100%, 420px); padding: 28px 22px; text-align: center;
      border-radius: 22px; background: var(--tg-theme-secondary-bg-color, #fff);
      box-shadow: 0 10px 30px #00000012;
    }
    .emoji { font-size: 52px; }
    h1 { margin: 12px 0 8px; }
    p { color: var(--tg-theme-hint-color, #718096); line-height: 1.5; }
    button {
      width: 100%; margin-top: 18px; padding: 15px 18px;
      border: 0; border-radius: 14px; cursor: pointer;
      color: var(--tg-theme-button-text-color, #fff);
      background: var(--tg-theme-button-color, #2481cc);
      font: inherit; font-weight: 700; font-size: 16px;
    }
    #status { min-height: 24px; margin-top: 16px; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <div class="emoji">👋</div>
    <h1>Привет!</h1>
    <p>Это твоё первое Telegram Mini App.</p>
    <button id="helloButton" type="button">Нажми меня</button>
    <div id="status" aria-live="polite"></div>
  </main>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    document.getElementById("helloButton").addEventListener("click", () => {
      document.getElementById("status").textContent = "🎉 Кнопка работает!";
      if (tg) tg.HapticFeedback?.notificationOccurred("success");
    });
  </script>
</body>
</html>
